# Migraciones a la base de datos OFICIAL (el proyecto de Supabase de producción).
#
# Cuando se fusiona en main algo que cambia supabase/migrations, GitHub las aplica solo, a la vez que
# Vercel publica la web. También se puede lanzar a mano: pestaña Actions → "Migraciones a producción"
# → Run workflow.
#
# Secretos que necesita (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN    token de la cuenta de Supabase (Account → Access Tokens)
#   PRODUCTION_PROJECT_ID    la referencia del proyecto oficial (la de su dirección: https://<ref>.supabase.co)
#   PRODUCTION_DB_PASSWORD   la contraseña de la base de datos del proyecto oficial
# Los secretos no se ven en los registros ni llegan a las PR de otras personas.
name: Migraciones a producción

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

# Nunca dos a la vez (y una que ya ha empezado no se corta)
concurrency:
  group: migraciones-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrar:
    name: Aplicar migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Comprobar los secretos
        run: |
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PRODUCTION_PROJECT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Falta el secreto de $s (mira el comentario de arriba del archivo)"; exit 1; fi
          done

      - name: Conectar con el proyecto oficial
        run: supabase link --project-ref "$PRODUCTION_PROJECT_ID"

      - name: Migraciones pendientes
        run: supabase migration list

      # Responde "sí" a la pregunta de si aplicarlas (aquí no hay nadie para pulsar la tecla)
      - name: Aplicar
        run: echo "y" | supabase db push
